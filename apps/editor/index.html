<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      // 在页面渲染前设好主题，避免先闪一下错误的颜色。
      ;(function () {
        // 和 theme/themes.ts 的规则一样：没选过就是深色。
        var choice = 'dark'
        try {
          choice = localStorage.getItem('twin-studio:theme') || 'dark'
        } catch (error) {}
        var dark = choice === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : choice !== 'light'
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="数字孪生三维场景编辑器" />
    <title>Twin Studio</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
